name = "cloud-r2pan"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ⚠️ 不要在这里写 admin 等敏感环境变量！
# 本地开发：放在 .dev.vars（已 gitignore，格式: KEY=value）
# 生产部署：用 wrangler secret put <NAME>

[[d1_databases]]
binding = "db"
database_name = "cloud-r2pan"
database_id = "8ab2ff5a-14b0-4cab-82a3-48ee549be053"

# R2 存储桶绑定
[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-r2pan"

# Analytics Engine 数据集绑定
[[analytics_engine_datasets]]
binding = "analytics"
dataset = "r2pan_downloads"

# 资源模块规则：HTML 作为文本导入；内置地球贴图作为二进制导入
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
